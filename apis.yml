name: DNN Software
description: >-
  DNN Software is the company behind DNN Platform (formerly DotNetNuke), a leading open-source
  web content management system (CMS) and web application framework built on Microsoft ASP.NET
  and C#. Originally created by Shaun Walker in 2002, DNN provides a modular platform for building
  websites, intranets, and web applications, extended through custom modules, providers, and skins.
  For developers, DNN ships a first-party set of .NET libraries on NuGet (DotNetNuke.Core,
  DotNetNuke.WebApi, DotNetNuke.Web, and related packages) plus a DotNetNuke Web API (ASP.NET Web API)
  services framework for building authenticated REST endpoints inside a DNN site. The open-source
  DNN Platform is developed in the open on GitHub under an MIT license, with community documentation,
  forums, and Discord maintained by the DNN Community.
