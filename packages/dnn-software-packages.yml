notes: >-
  First-party DNN Platform (DotNetNuke) .NET libraries published on NuGet under
  the official "dotnetnuke" owner. These are the framework/extension-development
  packages developers reference to build modules, providers, and Web API services
  on top of DNN; they are not REST API client SDKs (DNN is a self-hosted ASP.NET
  CMS, not a hosted API), so no `SDKs` pointer is emitted.
